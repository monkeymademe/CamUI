<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteTimelapseModal" tabindex="-1" role="dialog" aria-labelledby="deleteTimelapseModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteTimelapseModalLabel">Confirm Deletion</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Delete timelapse <strong id="deleteTimelapseName"></strong> and all its frames? This cannot be undone.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteTimelapseButton">Delete</button>
            </div>
        </div>
    </div>
</div>

<script>
    function openDeleteTimelapseModal(sessionId, sessionName) {
        const modal = new bootstrap.Modal(document.getElementById('deleteTimelapseModal'));
        document.getElementById('deleteTimelapseName').textContent = sessionName;
        document.getElementById('confirmDeleteTimelapseButton').setAttribute('data-session-id', sessionId);
        modal.show();
    }

    document.getElementById('confirmDeleteTimelapseButton').addEventListener('click', function () {
        const sessionId = this.getAttribute('data-session-id');
        const confirmButton = this;

        fetch(`/delete_timelapse/${encodeURIComponent(sessionId)}`, { method: 'DELETE' })
            .then(response => response.json().then(data => ({ ok: response.ok, data })))
            .then(({ ok, data }) => {
                if (!ok) throw new Error(data.message || 'Delete failed');
                window.location.href = '{{ url_for('timelapse_gallery') }}';
            })
            .catch(error => {
                alert(error.message || 'Failed to delete timelapse');
                const modalElement = document.getElementById('deleteTimelapseModal');
                const modalInstance = bootstrap.Modal.getInstance(modalElement);
                if (modalInstance) {
                    modalInstance.hide();
                    confirmButton.blur();
                }
            });
    });
</script>
